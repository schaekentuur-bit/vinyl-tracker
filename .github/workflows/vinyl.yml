name: Vinyl Report

on:
  schedule:
    - cron: '0 7 * * *'   # elke dag om 07:00 UTC
  workflow_dispatch:
    inputs:
      mark_read_keys:
        description: 'JSON array van listing-keys om als gelezen te markeren'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installeer dependencies
        run: pip install curl_cffi requests

      - name: Genereer rapport
        env:
          DISCOGS_TOKEN:       ${{ secrets.DISCOGS_TOKEN }}
          DISCOGS_COOKIES_B64: ${{ secrets.DISCOGS_COOKIES_B64 }}
          EMAIL_FROM:          ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
          EMAIL_PASS:          ${{ secrets.EMAIL_PASS }}
          FORCE_REFRESH:       ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          MARK_READ_KEYS:      ${{ github.event.inputs.mark_read_keys || '' }}
        run: python generate_report.py

      - name: Publiceer naar GitHub Pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ 2>/dev/null || true
          git add vinyl_deals_seen.json 2>/dev/null || true
          git add vinyl_listings_seen.json 2>/dev/null || true
          git add vinyl_sales_cache.json 2>/dev/null || true
          git add vinyl_listings_cache.json 2>/dev/null || true
          git add vinyl_history_cache.json 2>/dev/null || true
          git add user_releases.json 2>/dev/null || true
          git add vinyl_thumb_cache.json 2>/dev/null || true
          git status --short
          git diff --staged --quiet || git commit -m "Vinyl rapport $(date +'%Y-%m-%d %H:%M')"
          git push